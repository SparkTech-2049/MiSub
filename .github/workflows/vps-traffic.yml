name: VPS traffic refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    if: ${{ vars.MISUB_VPS_CRON_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      MISUB_CRON_URL: ${{ vars.MISUB_VPS_CRON_URL }}
      MISUB_CRON_SECRET: ${{ secrets.MISUB_CRON_SECRET }}
    steps:
      - name: Collect VPS traffic
        shell: bash
        run: |
          test -n "$MISUB_CRON_SECRET"
          case "$MISUB_CRON_URL" in https://*) ;; *) exit 1 ;; esac
          curl --silent --show-error --fail --proto '=https' --max-time 45 \
            -H "Authorization: Bearer $MISUB_CRON_SECRET" \
            --get --data-urlencode 'task=vps-traffic' "$MISUB_CRON_URL"
